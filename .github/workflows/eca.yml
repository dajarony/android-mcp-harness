name: ECA campaign

# The real thing: a booted AVD, a real Appium, the declared flows.
#
# Deliberately NOT a merge gate. An emulator in CI is slow and occasionally
# flaky, and a flaky gate teaches people to ignore red. This runs on demand and
# once a week, and a failure here is a finding to investigate, not a blocked
# pull request.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      api_level:
        description: Android API level to run the campaign against
        default: "36"
        type: string

jobs:
  campaign:
    name: Campaign against API ${{ inputs.api_level || '36' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM for a usable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          npm install

      - name: Start Appium
        run: |
          ./node_modules/.bin/appium --log appium.log &
          npx wait-on -t 60000 http://127.0.0.1:4723/status

      - name: Run the campaign on a disposable AVD
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level || '36' }}
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          script: |
            adb wait-for-device
            ANDROID_MCP_RUN_EMULATOR=1 python -m unittest tests.test_mcp_emulator_e2e -v

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eca-evidence-api-${{ inputs.api_level || '36' }}
          path: |
            artifacts/
            appium.log
          if-no-files-found: warn
          retention-days: 14
