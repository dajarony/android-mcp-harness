# SUME DOCBLOCK
# Nombre: arquitectura
# Tipo: Mapa global
# Entradas: módulos y contratos del arnés.
# Acciones: documenta las dependencias y la dirección de datos.
# Salidas: mapa vivo para revisión humana o de agentes.

system: android-mcp-harness
version: 0.4.0
last_updated: 2026-08-14
sume_version: "1.0"

routes:
  - path: cli.settings_demo
    method: "python main.py"
    entrada: entradas/comandos/demo_settings.py
    controlador: logica/controladores/demo_settings.py
    logica:
      - logica/sesiones/appium.py
      - logica/navegacion/ajustes.py
      - logica/evidencias/capturas.py
    contrato_entrada: contratos/demo_settings.py
    contrato_salida: contratos/demo_settings.py
    salida: salidas/consola/demo_settings.py
  - path: mcp.stdio
    method: "python -m entradas.mcp.server"
    entrada: entradas/mcp/server.py
    controlador: logica/servicios/mcp_server/controller.py
    logica:
      - logica/seguridad/emulador.py
      - logica/infraestructura/adb.py
      - logica/infraestructura/appium.py
      - logica/infraestructura/lanzador.py
      - logica/navegacion/semantica.py
      - logica/navegacion/resumen.py
      - logica/servicios/mcp_server/gate.py
      - logica/controladores/demo_settings.py
      - logica/evidencias/capturas.py
    contrato_entrada:
      - contratos/mcp.py
      - contratos/ui_control.py
    contrato_salida: contratos/mcp.py
    salida: "MCP structured output over local stdio"

contracts:
  - name: SettingsDemoConfig
    file: contratos/demo_settings.py
    used_by:
      - entradas/comandos/demo_settings.py
      - logica/sesiones/appium.py
      - logica/controladores/demo_settings.py
  - name: SettingsDemoResult
    file: contratos/demo_settings.py
    used_by:
      - logica/controladores/demo_settings.py
      - salidas/consola/demo_settings.py
  - name: McpToolResult
    file: contratos/mcp.py
    used_by:
      - entradas/mcp/server.py
      - logica/servicios/mcp_server/controller.py
  - name: HarnessError
    file: contratos/mcp.py
    used_by:
      - logica/seguridad/emulador.py
      - logica/infraestructura/adb.py
      - logica/infraestructura/appium.py
      - logica/servicios/mcp_server/gate.py

  - name: SemanticSelector
    file: contratos/ui_control.py
    used_by:
      - entradas/mcp/server.py
      - logica/navegacion/semantica.py
      - logica/navegacion/resumen.py
      - logica/servicios/mcp_server/controller.py

modules:
  - name: command-entry
    type: Entrada
    file: entradas/comandos/demo_settings.py
    depends_on: [demo-controller, demo-contract]
  - name: demo-controller
    type: Lógica
    file: logica/controladores/demo_settings.py
    depends_on: [appium-session, settings-navigation, screenshot-evidence]
  - name: appium-session
    type: Lógica
    file: logica/sesiones/appium.py
    depends_on: [demo-contract, emulator-security-boundary]
  - name: settings-navigation
    type: Lógica
    file: logica/navegacion/ajustes.py
    depends_on: []
  - name: screenshot-evidence
    type: Lógica
    file: logica/evidencias/capturas.py
    depends_on: []
  - name: console-output
    type: Salida
    file: salidas/consola/demo_settings.py
    depends_on: [demo-contract]
  - name: mcp-stdio-entry
    type: Entrada
    file: entradas/mcp/server.py
    depends_on: [android-mcp-controller, mcp-contract]
  - name: android-mcp-controller
    type: Lógica
    file: logica/servicios/mcp_server/controller.py
    depends_on: [emulator-operation-gate, adb-read-adapter, appium-status-adapter, demo-controller, app-launcher, semantic-navigation, screen-summary]
  - name: emulator-operation-gate
    type: Lógica
    file: logica/servicios/mcp_server/gate.py
    depends_on: [mcp-contract]
  - name: emulator-security-boundary
    type: Lógica
    file: logica/seguridad/emulador.py
    depends_on: [mcp-contract]
  - name: adb-read-adapter
    type: Lógica
    file: logica/infraestructura/adb.py
    depends_on: [emulator-security-boundary, mcp-contract]
  - name: appium-status-adapter
    type: Lógica
    file: logica/infraestructura/appium.py
    depends_on: [emulator-security-boundary, mcp-contract]

  - name: app-launcher
    type: Logic
    file: logica/infraestructura/lanzador.py
    depends_on: [adb-read-adapter, emulator-security-boundary, ui-control-contract]
  - name: screen-summary
    type: Logic
    file: logica/navegacion/resumen.py
    depends_on: [mcp-contract]
  - name: semantic-navigation
    type: Logic
    file: logica/navegacion/semantica.py
    depends_on: [ui-control-contract, appium-session]
  - name: ui-control-contract
    type: Contract
    file: contratos/ui_control.py
    depends_on: [mcp-contract]

specifications:
  - name: Android Emulator MCP Server
    file: docs/faser/mcp-server.faser.md
    status: implemented
    purpose: "Contrato funcional del gateway MCP stdio local"
  - name: MCP Android Emulator ECA v1
    file: docs/eca/mcp-emulator-v1.md
    status: executable
    purpose: "Independent oracle and real MCP behavior campaign"
  - name: Android UI Control
    file: docs/faser/android-ui-control.faser.md
    status: implemented
    purpose: "Semantic control, evidence and emulator boundary"
